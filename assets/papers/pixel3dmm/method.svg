<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050"><defs><linearGradient id="normal"><stop stop-color="#77b9cd"/><stop offset=".5" stop-color="#a89cde"/><stop offset="1" stop-color="#e39dba"/></linearGradient><linearGradient id="uv" x2=".9" y2="1"><stop stop-color="#e5b96a"/><stop offset="1" stop-color="#81c7af"/></linearGradient></defs><rect width="1600" height="1050" fill="#f2f6fa"/><g font-family="Malgun Gothic,sans-serif"><text x="50" y="60" font-size="38" fill="#233f55" font-weight="700">사진의 표면 방향과 대응점으로 3D 얼굴을 맞추기</text><text x="50" y="102" font-size="23" fill="#607584" font-weight="400">Pixel3DMM · 설명용 가상 얼굴과 메시이며 실제 입력·모델 예측·평가 결과가 아닙니다</text><rect x="40" y="140" width="360" height="360" rx="18" fill="white" stroke="#bfd0dd" stroke-width="2"/><text x="65" y="185" font-size="27" fill="#233f55" font-weight="700">1  얼굴 사진 크롭</text><g transform="translate(220 325) scale(0.85)" stroke="#3e657e" stroke-width="3" fill="#d7bdaa"><path d="M-55-65Q-80-5 -48 68Q0 115 48 68Q80-5 55-65Q0-103-55-65Z"/><path d="M-42-17L-15-17M15-17L42-17M0-5L-8 21L8 21" fill="none"/><ellipse cy="48" rx="20" ry="20" fill="#5b7489"/></g><text x="65" y="465" font-size="23" fill="#233f55" font-weight="400">512×512 · 전처리·MICA</text><path d="M405 325L470 325" stroke="#587d9b" stroke-width="4" fill="none"/><path d="M457 316L470 325L457 334" stroke="#587d9b" stroke-width="4" fill="none"/><rect x="485" y="140" width="605" height="360" rx="18" fill="white" stroke="#bfd0dd" stroke-width="2"/><text x="510" y="185" font-size="27" fill="#233f55" font-weight="700">2  두 DINOv2 예측기</text><g transform="translate(640 320) scale(0.75)" stroke="#3e657e" stroke-width="3" fill="url(#normal)"><path d="M-55-65Q-80-5 -48 68Q0 115 48 68Q80-5 55-65Q0-103-55-65Z"/><path d="M-42-17L-15-17M15-17L42-17M0-5L-8 21L8 21" fill="none"/><ellipse cy="48" rx="20" ry="20" fill="#5b7489"/></g><g transform="translate(935 320) scale(0.75)" stroke="#3e657e" stroke-width="3" fill="url(#uv)"><path d="M-55-65Q-80-5 -48 68Q0 115 48 68Q80-5 55-65Q0-103-55-65Z"/><path d="M-42-17L-15-17M15-17L42-17M0-5L-8 21L8 21" fill="none"/><ellipse cy="48" rx="20" ry="20" fill="#5b7489"/></g><text x="535" y="445" font-size="22" fill="#233f55" font-weight="400">normal · FLAME 좌표계</text><text x="825" y="445" font-size="22" fill="#233f55" font-weight="400">UV · 표면 대응 주소</text><text x="510" y="480" font-size="22" fill="#607584" font-weight="400">단서 예측은 feed-forward</text><path d="M1095 325L1160 325" stroke="#587d9b" stroke-width="4" fill="none"/><path d="M1147 316L1160 325L1147 334" stroke="#587d9b" stroke-width="4" fill="none"/><rect x="1175" y="140" width="385" height="360" rx="18" fill="white" stroke="#bfd0dd" stroke-width="2"/><text x="1200" y="185" font-size="26" fill="#233f55" font-weight="700">3  이미지의 정점 대응</text><g transform="translate(1365 320) scale(0.85)" stroke="#3e657e" stroke-width="3" fill="#e2eaf0"><path d="M-55-65Q-80-5 -48 68Q0 115 48 68Q80-5 55-65Q0-103-55-65Z"/><path d="M-42-17L-15-17M15-17L42-17M0-5L-8 21L8 21" fill="none"/><ellipse cy="48" rx="20" ry="20" fill="#5b7489"/><circle cx="-30" cy="-17" r="5" fill="#d87d54" stroke="none"/><circle cx="30" cy="-17" r="5" fill="#d87d54" stroke="none"/><circle cx="0" cy="15" r="5" fill="#d87d54" stroke="none"/><circle cx="-18" cy="48" r="5" fill="#d87d54" stroke="none"/><circle cx="18" cy="48" r="5" fill="#d87d54" stroke="none"/><circle cx="0" cy="78" r="5" fill="#d87d54" stroke="none"/></g><text x="1200" y="450" font-size="23" fill="#233f55" font-weight="400">UV 최근접 이웃 검색</text><text x="1200" y="485" font-size="22" fill="#607584" font-weight="400">UV ≠ 텍스처 이미지</text><rect x="40" y="550" width="1520" height="410" rx="18" fill="#e9f1f7" stroke="#bfd0dd" stroke-width="2"/><text x="65" y="597" font-size="29" fill="#233f55" font-weight="700">4  FLAME + 카메라 피팅  |  전체 복원에는 추론 중 최적화가 필요</text><g transform="translate(215 760) scale(0.9)" stroke="#3e657e" stroke-width="3" fill="#c6d6e2"><path d="M-55-65Q-80-5 -48 68Q0 115 48 6