<text x="55" y="65" class="title">Tele360 · v1 설명 도식</text>
<text x="55" y="105" class="note">unposed = 사전 카메라 보정 선택 사항 · 입력 프레임은 동기화해야 합니다.</text>
<text x="55" y="162" class="section">매 시점의 다중뷰 재구성</text>
