<text x="1118" y="274" class="body">깊이 · Gaussian 속성</text>
<text x="1118" y="314" class="body">카메라 전용 LM 정제 4회</text>
<text x="1118" y="354" class="body">깊이를 3D 위치로 변환</text>
<text x="55" y="481" class="section">Gaussian maps 전송과 원격 표시</text>
<rect x="55" y="507" width="440" height="218" rx="17" fill="#fff" stroke="#b6c9d9" stroke-width="2"/>
