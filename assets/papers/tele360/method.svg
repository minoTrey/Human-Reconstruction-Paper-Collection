<text x="1118" y="634" class="body">3D Gaussians로 구성</text>
<text x="1118" y="674" class="body">사용자가 정한 시점에서 표시</text>
<rect x="55" y="757" width="1480" height="70" rx="13" fill="#fff1dc"/>
<text x="77" y="783" class="note">RTX 5090 · 6뷰 2K: 모델 추론 35.36ms (캡처·전송·표시 제외)</text><text x="77" y="812" class="note">동작→화면 지연: MacBook Pro 약 500ms · iPad Pro 약 650ms</text>
