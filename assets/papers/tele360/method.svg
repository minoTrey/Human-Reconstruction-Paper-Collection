<text x="598" y="634" class="body">H.265 인코딩</text>
<text x="598" y="674" class="body">WebRTC 스트리밍</text>
<path d="M1027 616 h47" class="flow"/>
<rect x="1095" y="507" width="440" height="218" rx="17" fill="#e8f1f9" stroke="#b6c9d9" stroke-width="2"/>
