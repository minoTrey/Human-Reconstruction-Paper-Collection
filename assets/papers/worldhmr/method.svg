<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f7f9fc"/><g font-family="Segoe UI,Malgun Gothic,sans-serif"><text x="45" y="55" font-size="37" fill="#1d3b54" font-weight="700">빠른 카메라와 정지한 발 · 서로 다른 척도를 맞추기</text><text x="45" y="97" font-size="23" fill="#647c90" font-weight="400">독립 설명 도식 · 아래 좌표와 이동량은 원리를 보여주는 가상 예입니다.</text><rect x="45" y="125" width="340" height="95" rx="16" fill="#eaf2f8" stroke="#b8cddd" stroke-width="2"/><text x="65" y="163" font-size="25" fill="#1d3b54" font-weight="700">단안 영상</text><text x="65" y="197" font-size="21" fill="#1d3b54" font-weight="400">ViPE 카메라 + 인체 추정</text><path d="M395 173L425 173" stroke="#466f91" stroke-width="4" fill="none"/><path d="M411 164L425 173L411 182" fill="none" stroke="#466f91" stroke-width="4"/><rect x="435" y="125" width="340" height="95" rx="16" fill="#eaf2f8" stroke="#b8cddd" stroke-width="2"/><text x="455" y="163" font-size="25" fill="#1d3b54" font-weight="700">정지 구간 선택</text><text x="455" y="197" font-size="21" fill="#1d3b54" font-weight="400">접촉 신뢰도 · 운동 · 회전</text><path d="M785 173L815 173" stroke="#466f91" stroke-width="4" fill="none"/><path d="M801 164L815 173L801 182" fill="none" stroke="#466f91" stroke-width="4"/><rect x="825" y="125" width="340" height="95" rx="16" fill="#eaf2f8" stroke="#b8cddd" stroke-width="2"/><text x="845" y="163" font-size="25" fill="#1d3b54" font-weight="700">공통 스케일 추정</text><text x="845" y="197" font-size="21" fill="#1d3b54" font-weight="400">가중 최소제곱 · 닫힌식</text><path d="M1175 173L1205 173" stroke="#466f91" stroke-width="4" fill="none"/><path d="M1191 164L1205 173L1191 182" fill="none" stroke="#466f91" stroke-width="4"/><rect x="1215" y="125" width="340" height="95" rx="16" fill="#eaf2f8" stroke="#b8cddd" stroke-width="2"/><text x="1235" y="163" font-size="25" fill="#1d3b54" font-weight="700">최적화와 출력</text><text x="1235" y="197" font-size="21" fill="#1d3b54" font-weight="400">SMPL-X + 카메라 궤적</text><rect x="45" y="245" width="1510" height="275" rx="16" fill="#fff" stroke="#b8cddd" stroke-width="2"/><text x="70" y="284" font-size="28" fill="#bc713b" font-weight="700">다른 척도를 그대로 합성</text><text x="70" y="320" font-size="23" fill="#1d3b54" font-weight="400">카메라 이동은 4 · 인체 상대 거리는 6만큼 줄어듦</text><path d="M175 450L1323 450" stroke="#94aabb" stroke-width="2" fill="none"/><path d="M175 445L175 456" stroke="#8da6b8" stroke-width="2" fill="none"/><text x="167" y="483" font-size="21" fill="#647c90" font-weight="400">0</text><path d="M339 445L339 456" stroke="#8da6b8" stroke-width="2" fill="none"/><text x="331" y="483" font-size="21" fill="#647c90" font-weight="400">2</text><path d="M503 445L503 456" stroke="#8da6b8" stroke-width="2" fill="none"/><text x="495" y="483" font-size="21" fill="#647c90" font-weight="400">4</text><path d="M667 445L667 456" stroke="#8da6b8" stroke-width="2" fill="none"/><text x="659" y="483" font-size="21" fill="#647c90" font-weight="400">6</text><path d="M831 445L831 456" stroke="#8da6b8" stroke-width="2" fill="none"/><text x="823" y="483" font-size="21" fill="#647c90" font-weight="400">8</text><path d="M995 445L995 456" stroke="#8da6b8" stroke-width="2" fill="none"/><text x="987" y="483" font-size="21" fill="#647c90" font-weight="400">10</text><path d="M1159 445L1159 456" stroke="#8da6b8" stroke-width="2" fill="none"/><text x="1151" y="483" font-size="21" fill="#647c90" font-weight="400">12</text><path d="M1323 445L1323 456" stroke="#8da6b8" stroke-width="2" fill="none"/><text x="1315" y="483" font-size="21" fill="#647c90" font-weight="400">14</text><path d="M158 377H180V399H158Z M180 381L193 374V402L180 395" fill="none" stroke="#7f95a8" stroke-width="3"/><path d="M486 377H508V399H486Z M508 381L521 374V402L508 395" fill="none" stroke="#bc713b" stroke-width="3"/><path d="M200 388L478 388" stroke="#bc713b" stroke-width="4" fill="none"/><path d="M464 379L478 388L464 397" fill="none" stroke="#bc713b" stroke-width="4"/><g stroke="#8396a5" fill="none" stroke-width="3" opacity="0.4"><circle cx="831" cy="374" r="12"/><path d="M814 393L848 393L854 429L808 429Z M814 393L854 429 M848 393L808 429 M831 429L818 450 M831 429L844 450 M815 396L796 424 M847 396L866 424"/></g><g stroke="#bc713b" fill="none" stroke-width="3" opacity="1"><circle cx="667" cy="374" r="12"/><path d="M650 393L684 393L690 429L644 429Z M650 393L690 429 M684 393L644 429 M667 429L654 450 M667 429L680 450 M651 396L632 424 M683 396L702 424"/></g><text x="655" y="345" font-size="23" fill="#bc713b" font-weight="700">A</text><path d="M827 440L690 440" stroke="#bc713b" stroke-width="4" fill="none"/><path d="M704 431L690 440L704 449" fill="none" stroke="#bc713b" stroke-width="4"/><text x="630" y="510" font-size="20" fill="#bc713b" font-weight="400">2만큼 밀림</text><g stroke="#8396a5" fill="none" stroke-width="3" opacity="0.4"><circle cx="1159" cy="374" r="12"/><path d="M1142 393L1176 393L1182 429L1136 429Z M1142 393L1182 429 M1176 393L1136 429 M1159 429L1146 450 M1159 429L1172 450 M1143 396L1124 424 M1175 396L1194 424"/></g><g stroke="#bc713b" fill="none" stroke-width="3" opacity="1"><circle cx="995" cy="374" r="12"/><path d="M978 393L1012 393L1018 429L972 429Z M978 393L1018 429 M1012 393L972 429 M995 429L982 450 M995 429L1008 450 M979 396L960 424 M1011 396L1030 424"/></g><text x="983" y="345" font-size="23" fill="#bc713b" font-weight="700">B</text><path d="M1155 440L1018 440" stroke="#bc713b" stroke-width="4" fill="none"/><path d="M1032 431L1018 440L1032 449" fill="none" stroke="#bc713b" stroke-width="4"/><text x="958" y="510" font-size="20" fill="#bc713b" font-weight="400">2만큼 밀림</text><text x="1280" y="385" font-size="21" fill="#bc713b" font-weight="400">회색: 정지 가정</text><text x="1280" y="422" font-size="21" fill="#bc713b" font-weight="400">색: 잘못 합성</text><rect x="45" y="545" width="1510" height="275" rx="16" fill="#fff" stroke="#b8cddd" stroke-width="2"/><text x="70" y="584" font-size="28" fill="#247b78" font-weight="700">공통 스케일로 보정</text><text x="70" y="620" font-size="23" fill="#1d3b54" font-weight="400">카메라 이동 4 × 1.5 = 6 · 같은 스케일을 두 사람에 적용</text><path d="M175 750L1323 750" stroke="#94aabb" stroke-width="2" fill="none"/><path d="M175 745L175 756" stroke="#8da6b8" stroke-width="2" fill="none"/><text x="167" y="783" font-size="21" fill="#647c90" font-weight="400">0</text><path d="M339 745L339 756" stroke="#8da6b8" stroke-width="2" fill="none"/><text x="331" y="783" font-size="21" fill="#647c90" font-weight="400">2</text><path d="M503 745L503 756" stroke="#8da6b8" stroke-width="2" fill="none"/><text x="495" y="783" font-size="21" fill="#647c90" font-weight="400">4</text><path d="M667 745L667 756" stroke="#8da6b8" stroke-width="2" fill="none"/><text x="659" y="783" font-size="21" fill="#647c90" font-weight="400">6</text><path d="M831 745L831 756" stroke="#8da6b8" stroke-width="2" fill="none"/><text x="823" y="783" font-size="21" fill="#647c90" font-weight="400">8</text><path d="M995 745L995 756" stroke="#8da6b8" stroke-width="2" fill="none"/><text x="987" y="783" font-size="21" fill="#647c90" font-weight="400">10</text><path d="M1159 745L1159 756" stroke="#8da6b8" stroke-width="2" fill="none"/><text x="1151" y="783" font-size="21" fill="#647c90" font-weight="400">12</text><path d="M1323 745L1323 756" stroke="#8da6b8" stroke-width="2" fill="none"/><text x="1315" y="783" font-size="21" fill="#647c90" font-weight="400">14</text><path d="M158 677H180V699H158Z M180 681L193 674V702L180 695" fill="none" stroke="#7f95a8" stroke-width="3"/><path d="M650 677H672V699H650Z M672 681L685 674V702L672 695" fill="none" stroke="#247b78" stroke-width="3"/><path d="M200 688L642 688" stroke="#247b78" stroke-width="4" fill="none"/><path d="M628 679L642 688L628 697" fill="none" stroke="#247b78" stroke-width="4"/><g stroke="#356faf" fill="none" stroke-width="3" opacity="1"><circle cx="831" cy="674" r="12"/><path d="M814 693L848 693L854 729L808 729Z M814 693L854 729 M848 693L808 729 M831 729L818 750 M831 729L844 750 M815 696L796 724 M847 696L866 724"/></g><text x="819" y="645" font-size="23" fill="#356faf" font-weight="700">A</text><g stroke="#598361" fill="none" stroke-width="3" opacity="1"><circle cx="1159" cy="674" r="12"/><path d="M1142 693L1176 693L1182 729L1136 729Z M1142 693L1182 729 M1176 693L1136 729 M1159 729L1146 750 M1159 729L1172 750 M1143 696L1124 724 M1175 696L1194 724"/></g><text x="1147" y="645" font-size="23" fill="#598361" font-weight="700">B</text><text x="1280" y="685" font-size="21" fill="#247b78" font-weight="400">발 위치 유지</text><text x="1280" y="722" font-size="21" fill="#247b78" font-weight="400">A = 8, B = 12</text><rect x="45" y="845" width="1510" height="115" rx="16" fill="#eaf2f8" stroke="#b8cddd" stroke-width="2"/><text x="70" y="882" font-size="23" fill="#1d3b54" font-weight="400">정지 발 구간을 고른 뒤 같은 s를 적용합니다. 이후 영상 정합·시간 연속성·관통 억제로 다듬습니다.</text><text x="70" y="923" font-size="23" fill="#705941" font-weight="400">한계: 가려져 이미 틀린 사람 깊이, 클립 안에서 변하는 스케일은 이 보정만으로 해결하지 못합니다.</text></g></svg>